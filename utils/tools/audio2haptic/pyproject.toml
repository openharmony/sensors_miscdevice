[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio2haptic-openharmony"
version = "0.1.0"
description = "OpenHarmony DSP-only audio-to-haptic CLI"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = ["numpy"]

[project.scripts]
audio2haptic = "audio2haptic.app.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"audio2haptic.resources" = ["haptic_policies/*.json", "haptic_profiles/*.json"]

[tool.setuptools.packages.find]
include = ["audio2haptic*"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.messages_control]
disable = [
  "missing-class-docstring",
  "missing-function-docstring",
  "missing-module-docstring",
]
